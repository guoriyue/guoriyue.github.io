<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">Run the same instruction list for each program</title><desc id="desc">Each program has private intermediate values and shared input arrays</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#646b73"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="650" fill="#ffffff"/>
<text x="32" y="44" font-size="29" fill="#252525" font-weight="700">Run the same instruction list for each program</text>
<text x="32" y="78" font-size="20" fill="#646b73">Each program has private intermediate values and shared input arrays</text>
<rect x="242" y="110" width="476" height="105" rx="4" fill="#f1f2f3" stroke="#c9ced4"/>
<text x="264" y="149" font-size="26" fill="#3e4852" font-weight="700">run with grid = 2</text>
<text x="264" y="193" font-size="25" fill="#252525">Use program IDs 0 and 1</text>
<path d="M360 223L244 279" stroke="#646b73" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M600 223L716 279" stroke="#646b73" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="290" width="420" height="180" rx="4" fill="#e8eef4" stroke="#c9ced4"/>
<text x="54" y="329" font-size="26" fill="#315a7d" font-weight="700">execute program 0</text>
<text x="54" y="373" font-size="25" fill="#252525">Fresh values dictionary</text>
<text x="54" y="409" font-size="25" fill="#252525">Offsets  [0, 1, 2, 3]</text>
<rect x="508" y="290" width="420" height="180" rx="4" fill="#e8eef4" stroke="#c9ced4"/>
<text x="530" y="329" font-size="26" fill="#315a7d" font-weight="700">execute program 1</text>
<text x="530" y="373" font-size="25" fill="#252525">Fresh values dictionary</text>
<text x="530" y="409" font-size="25" fill="#252525">Offsets  [4, 5, 6, 7]</text>
<path d="M242 477 L242 520 L445 520" stroke="#646b73" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M718 477 L718 520 L515 520" stroke="#646b73" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="370" y="558" font-size="27" fill="#315a7d" font-weight="700">Shared out array</text>
<rect x="32" y="577" width="896" height="48" rx="4" fill="#e8eef4" stroke="#c9ced4"/>
<text x="50" y="609" font-size="21" fill="#315a7d">The CPU interpreter executes these program instances sequentially</text>
</svg>