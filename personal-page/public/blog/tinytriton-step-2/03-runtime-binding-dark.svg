<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">Bind parameter descriptions to one invocation</title><desc id="desc">Actual arrays stay in arguments and pointers describe their locations</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a6afb8"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="650" fill="#131b24"/>
<text x="32" y="44" font-size="29" fill="#dde2e7" font-weight="700">Bind parameter descriptions to one invocation</text>
<text x="32" y="78" font-size="20" fill="#a6afb8">Actual arrays stay in arguments and pointers describe their locations</text>
<rect x="32" y="110" width="420" height="270" rx="4" fill="#202932" stroke="#3a4551"/>
<text x="54" y="149" font-size="26" fill="#c4ccd4" font-weight="700">arguments</text>
<text x="54" y="193" font-size="23" fill="#dde2e7">x → [0, 1, 2, 3, 4, 5]</text>
<text x="54" y="229" font-size="23" fill="#dde2e7">y → [10, 10, 10, 10, 10, 10]</text>
<text x="54" y="265" font-size="23" fill="#dde2e7">out → eight writable positions</text>
<text x="54" y="301" font-size="23" fill="#dde2e7">n → 6</text>
<rect x="508" y="110" width="420" height="270" rx="4" fill="#23313f" stroke="#3a4551"/>
<text x="530" y="149" font-size="26" fill="#b4c8d8" font-weight="700">values</text>
<text x="530" y="193" font-size="23" fill="#dde2e7">x → (array x, index 0)</text>
<text x="530" y="229" font-size="23" fill="#dde2e7">y → (array y, index 0)</text>
<text x="530" y="265" font-size="23" fill="#dde2e7">out → (array out, index 0)</text>
<text x="530" y="301" font-size="23" fill="#dde2e7">n → 6</text>
<path d="M462 240L496 240" stroke="#a6afb8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="420" width="896" height="120" rx="4" fill="#202932" stroke="#3a4551"/>
<text x="54" y="459" font-size="26" fill="#c4ccd4" font-weight="700">BLOCK is already recorded in the IR</text>
<text x="54" y="503" font-size="24" fill="#dde2e7">The const instruction returns 4 without a runtime BLOCK parameter</text>
<rect x="32" y="577" width="896" height="48" rx="4" fill="#23313f" stroke="#3a4551"/>
<text x="50" y="609" font-size="21" fill="#b4c8d8">Binding supplies the runtime meaning of each declared input</text>
</svg>