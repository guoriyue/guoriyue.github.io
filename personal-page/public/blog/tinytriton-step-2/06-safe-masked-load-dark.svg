<text x="255" y="273" font-size="26" fill="#b4c8d8" font-weight="700">True</text>
<text x="400" y="273" font-size="26" fill="#b4c8d8" font-weight="700">5</text>
<text x="560" y="273" font-size="26" fill="#b4c8d8" font-weight="700">600</text>
<text x="770" y="273" font-size="26" fill="#b4c8d8" font-weight="700">600</text>
<rect x="32" y="309" width="896" height="63" rx="4" fill="#352b2a" stroke="#3a4551"/>
<text x="60" y="350" font-size="26" fill="#d1a49c" font-weight="700">6</text>
