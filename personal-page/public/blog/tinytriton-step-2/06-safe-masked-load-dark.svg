<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">The mask must affect indexing before the read</title><desc id="desc">Example with x = [100, 200, 300, 400, 500, 600] and fallback 7</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a6afb8"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="680" fill="#131b24"/>
<text x="32" y="44" font-size="29" fill="#dde2e7" font-weight="700">The mask must affect indexing before the read</text>
<text x="32" y="78" font-size="20" fill="#a6afb8">Example with x = [100, 200, 300, 400, 500, 600] and fallback 7</text>
