<text x="245" y="133" font-size="20" fill="#dde2e7" font-weight="700">Mask</text>
<text x="390" y="133" font-size="20" fill="#dde2e7" font-weight="700">Safe index</text>
<text x="550" y="133" font-size="20" fill="#dde2e7" font-weight="700">Gathered value</text>
<text x="760" y="133" font-size="20" fill="#dde2e7" font-weight="700">Load result</text>
