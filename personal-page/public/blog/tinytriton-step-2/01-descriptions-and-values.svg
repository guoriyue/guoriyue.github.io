<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">Descriptions become actual runtime values</title><desc id="desc">Source names and IR names belong to different lookup tables</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#646b73"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="590" fill="#ffffff"/>
<text x="32" y="44" font-size="29" fill="#252525" font-weight="700">Descriptions become actual runtime values</text>
<text x="32" y="78" font-size="20" fill="#646b73">Source names and IR names belong to different lookup tables</text>
<rect x="32" y="110" width="420" height="190" rx="4" fill="#f1f2f3" stroke="#c9ced4"/>
<text x="54" y="149" font-size="26" fill="#3e4852" font-weight="700">During lowering</text>
<text x="54" y="193" font-size="25" fill="#252525">Source name  offsets</text>
<text x="54" y="229" font-size="25" fill="#252525">IR description  Value for %4</text>
<rect x="508" y="110" width="420" height="190" rx="4" fill="#e8eef4" stroke="#c9ced4"/>
<text x="530" y="149" font-size="26" fill="#315a7d" font-weight="700">During execution</text>
<text x="530" y="193" font-size="25" fill="#252525">IR name  %4</text>
<text x="530" y="229" font-size="25" fill="#252525">Actual array  [4, 5, 6, 7]</text>
<path d="M462 205L496 205" stroke="#646b73" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="340" width="896" height="130" rx="4" fill="#f1f2f3" stroke="#c9ced4"/>
<text x="54" y="379" font-size="26" fill="#3e4852" font-weight="700">The bridge is the IR name</text>
<text x="54" y="423" font-size="25" fill="#252525">env finds the description and values finds its runtime contents</text>
<rect x="32" y="517" width="896" height="48" rx="4" fill="#e8eef4" stroke="#c9ced4"/>
<text x="50" y="549" font-size="21" fill="#315a7d">The interpreter follows the existing IR instead of parsing source again</text>
</svg>