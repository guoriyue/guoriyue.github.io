<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">Resolve inputs before recording the operation</title><desc id="desc">Trace visit(a + b * 2)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#637580"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#374d5d}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="590" fill="#f8fafb"/>
<text x="32" y="44" font-size="28" style="fill:#374d5d" font-weight="700">Resolve inputs before recording the operation</text>
<text x="32" y="78" font-size="19" style="fill:#637580">Trace visit(a + b * 2)</text>
<rect x="32" y="110" width="896" height="60" rx="10" fill="#fff" stroke="#dce5e9"/>
<text x="52" y="149" font-size="24" style="fill:#277a9a" font-weight="700">1</text>
<text x="110" y="149" font-size="24" style="fill:#374d5d" class="code">visit(a)</text>
<text x="480" y="149" font-size="24" style="fill:#374d5d">Return an existing Value</text>
<rect x="32" y="183" width="896" height="60" rx="10" fill="#fff" stroke="#dce5e9"/>
<text x="52" y="222" font-size="24" style="fill:#277a9a" font-weight="700">2</text>
<text x="110" y="222" font-size="24" style="fill:#374d5d" class="code">visit(b)</text>
<text x="480" y="222" font-size="24" style="fill:#374d5d">Return an existing Value</text>
<rect x="32" y="256" width="896" height="60" rx="10" fill="#e3f3f8" stroke="#dce5e9"/>
<text x="52" y="295" font-size="24" style="fill:#277a9a" font-weight="700">3</text>
<text x="110" y="295" font-size="24" style="fill:#374d5d" class="code">visit(2)</text>
<text x="480" y="295" font-size="24" style="fill:#374d5d">Emit const and return %0</text>
<rect x="32" y="329" width="896" height="60" rx="10" fill="#e3f3f8" stroke="#dce5e9"/>
<text x="52" y="368" font-size="24" style="fill:#277a9a" font-weight="700">4</text>
<text x="110" y="368" font-size="24" style="fill:#374d5d" class="code">emit mul(b, %0)</text>
<text x="480" y="368" font-size="24" style="fill:#374d5d">Return the new Value %1</text>
<rect x="32" y="402" width="896" height="60" rx="10" fill="#e3f3f8" stroke="#dce5e9"/>
<text x="52" y="441" font-size="24" style="fill:#277a9a" font-weight="700">5</text>
<text x="110" y="441" font-size="24" style="fill:#374d5d" class="code">emit add(a, %1)</text>
<text x="480" y="441" font-size="24" style="fill:#374d5d">Return the new Value %2</text>
<rect x="32" y="517" width="896" height="48" rx="10" fill="#e3f3f8" stroke="#dce5e9"/>
<text x="50" y="549" font-size="21" style="fill:#277a9a">emit appends an instruction and returns its Value without doing arithmetic</text>
</svg>