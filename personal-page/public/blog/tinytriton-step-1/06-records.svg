<svg xmlns="http://www.w3.org/2000/svg" width="960" height="710" viewBox="0 0 960 710" role="img" aria-labelledby="title desc"><title id="title">Three records have three different responsibilities</title><desc id="desc">A Value describes data without storing its actual contents</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60768a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="710" fill="#f8fafc"/>
<text x="32" y="44" font-size="29" fill="#263d50" font-weight="700">Three records have three different responsibilities</text>
<text x="32" y="78" font-size="20" fill="#60768a">A Value describes data without storing its actual contents</text>
<rect x="32" y="110" width="896" height="135" rx="12" fill="#e2f1ff" stroke="#d8e3ee"/>
<text x="54" y="149" font-size="26" fill="#215a8b" font-weight="700">Program</text>
<text x="54" y="193" font-size="25" fill="#263d50">The function interface and its instruction list</text>
<rect x="627" y="128" width="277" height="36" rx="18" fill="#e2f1ff" stroke="#d8e3ee"/>
<text x="641" y="153" font-size="20" fill="#215a8b" font-weight="700">Owns the computation</text>
<rect x="32" y="275" width="896" height="135" rx="12" fill="#eee6fc" stroke="#d8e3ee"/>
<text x="54" y="314" font-size="26" fill="#65419c" font-weight="700">Instr</text>
<text x="54" y="358" font-size="25" fill="#263d50">One operation with inputs and an optional result</text>
<rect x="627" y="293" width="277" height="36" rx="18" fill="#eee6fc" stroke="#d8e3ee"/>
<text x="641" y="318" font-size="20" fill="#65419c" font-weight="700">Records a step</text>
<rect x="32" y="440" width="896" height="135" rx="12" fill="#dcf5ed" stroke="#d8e3ee"/>
<text x="54" y="479" font-size="26" fill="#166e5b" font-weight="700">Value</text>
<text x="54" y="523" font-size="25" fill="#263d50">A result name together with its type and shape</text>
<rect x="627" y="458" width="277" height="36" rx="18" fill="#dcf5ed" stroke="#d8e3ee"/>
<text x="641" y="483" font-size="20" fill="#166e5b" font-weight="700">Describes a value</text>
<path d="M480 251L480 269" stroke="#60768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M480 416L480 434" stroke="#60768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="637" width="896" height="48" rx="12" fill="#ffe5e5" stroke="#d8e3ee"/>
<text x="50" y="669" font-size="21" fill="#9d3e47">A store has an effect on memory but does not produce a result Value</text>
</svg>