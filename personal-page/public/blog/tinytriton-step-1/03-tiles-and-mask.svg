<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">Two tiles cover six input elements</title><desc id="desc">BLOCK = 4 and n = 6</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#637580"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#374d5d}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="550" fill="#f8fafb"/>
<text x="32" y="44" font-size="28" style="fill:#374d5d" font-weight="700">Two tiles cover six input elements</text>
<text x="32" y="78" font-size="19" style="fill:#637580">BLOCK = 4 and n = 6</text>
<rect x="32" y="110" width="896" height="70" rx="10" fill="#e3f3f8" stroke="#dce5e9"/>
<text x="53" y="153" font-size="25" style="fill:#374d5d" class="code">offsets = program_id × BLOCK + arange(0, BLOCK)</text>
