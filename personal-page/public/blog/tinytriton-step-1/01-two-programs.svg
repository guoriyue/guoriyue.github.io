<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">The compiler and the kernel</title><desc id="desc">One program runs while another program is being translated</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#637580"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#374d5d}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="570" fill="#f8fafb"/>
<text x="32" y="44" font-size="28" style="fill:#374d5d" font-weight="700">The compiler and the kernel</text>
<text x="32" y="78" font-size="19" style="fill:#637580">One program runs while another program is being translated</text>
<rect x="32" y="110" width="420" height="250" rx="10" fill="#e3f3f8" stroke="#dce5e9"/>
<text x="52" y="146" font-size="24" style="fill:#374d5d" font-weight="700">Compiler execution</text>
<text x="52" y="188" font-size="22" style="fill:#374d5d">Parse the source string</text>
<text x="52" y="224" font-size="22" style="fill:#374d5d">Create Value and Instr records</text>
<text x="52" y="260" font-size="22" style="fill:#374d5d">Update the name environment</text>
<text x="52" y="296" font-size="22" style="fill:#374d5d">Return a Program</text>
<rect x="508" y="110" width="420" height="250" rx="10" fill="#fff" stroke="#dce5e9"/>
<text x="528" y="146" font-size="24" style="fill:#374d5d" font-weight="700">Kernel execution</text>
<text x="528" y="188" font-size="22" style="fill:#374d5d">Read the input arrays</text>
<text x="528" y="224" font-size="22" style="fill:#374d5d">Compute elementwise sums</text>
<text x="528" y="260" font-size="22" style="fill:#374d5d">Write the output array</text>
<text x="528" y="296" font-size="22" style="fill:#374d5d">Begins in a later lesson</text>
