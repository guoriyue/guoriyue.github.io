<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">The compiler describes work before execution</title><desc id="desc">The compiler runs now and the kernel runs later</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60768a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="570" fill="#f8fafc"/>
<text x="32" y="44" font-size="29" fill="#263d50" font-weight="700">The compiler describes work before execution</text>
<text x="32" y="78" font-size="20" fill="#60768a">The compiler runs now and the kernel runs later</text>
<rect x="32" y="110" width="420" height="220" rx="12" fill="#eee6fc" stroke="#d8e3ee"/>
<text x="54" y="149" font-size="26" fill="#65419c" font-weight="700">Compiler</text>
<text x="54" y="193" font-size="24" fill="#263d50">Read source syntax</text>
<text x="54" y="229" font-size="24" fill="#263d50">Build records and dependencies</text>
<text x="54" y="265" font-size="24" fill="#263d50">Return a Program</text>
<rect x="508" y="110" width="420" height="220" rx="12" fill="#dcf5ed" stroke="#d8e3ee"/>
<text x="530" y="149" font-size="26" fill="#166e5b" font-weight="700">Kernel</text>
<text x="530" y="193" font-size="24" fill="#263d50">Read actual input arrays</text>
<text x="530" y="229" font-size="24" fill="#263d50">Compute elementwise sums</text>
<text x="530" y="265" font-size="24" fill="#263d50">Write the output array</text>
<path d="M462 220L496 220" stroke="#60768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="368" width="206" height="99" rx="12" fill="#e2f1ff" stroke="#d8e3ee"/>
<text x="50" y="405" font-size="25" fill="#215a8b" font-weight="700">Source</text>
<text x="50" y="441" font-size="20" fill="#263d50">Text</text>
<rect x="262" y="368" width="206" height="99" rx="12" fill="#fff0ce" stroke="#d8e3ee"/>
<text x="280" y="405" font-size="25" fill="#8b5c13" font-weight="700">AST</text>
<text x="280" y="441" font-size="20" fill="#263d50">Nested syntax</text>
<rect x="492" y="368" width="206" height="99" rx="12" fill="#eee6fc" stroke="#d8e3ee"/>
<text x="510" y="405" font-size="25" fill="#65419c" font-weight="700">IR</text>
<text x="510" y="441" font-size="20" fill="#263d50">Named operations</text>
<rect x="722" y="368" width="206" height="99" rx="12" fill="#dcf5ed" stroke="#d8e3ee"/>
<text x="740" y="405" font-size="25" fill="#166e5b" font-weight="700">Execution</text>
<text x="740" y="441" font-size="20" fill="#263d50">Actual data</text>
<path d="M242 417L256 417" stroke="#60768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M472 417L486 417" stroke="#60768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M702 417L716 417" stroke="#60768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="497" width="896" height="48" rx="12" fill="#eee6fc" stroke="#d8e3ee"/>
<text x="50" y="529" font-size="21" fill="#65419c">Recording an operation does not execute it</text>
</svg>