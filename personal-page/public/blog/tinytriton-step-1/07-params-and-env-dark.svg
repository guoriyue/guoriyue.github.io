<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc"><title id="title">One parameter record serves two purposes</title><desc id="desc">Both containers refer to the same Value object</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a6afb8"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="660" fill="#131b24"/>
<text x="32" y="44" font-size="29" fill="#dde2e7" font-weight="700">One parameter record serves two purposes</text>
<text x="32" y="78" font-size="20" fill="#a6afb8">Both containers refer to the same Value object</text>
<rect x="242" y="110" width="476" height="120" rx="4" fill="#23313f" stroke="#3a4551"/>
<text x="264" y="149" font-size="26" fill="#b4c8d8" font-weight="700">The input named n</text>
<text x="264" y="193" font-size="26" fill="#dde2e7">One integer Value record</text>
<path d="M360 237L244 295" stroke="#a6afb8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M600 237L716 295" stroke="#a6afb8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="307" width="420" height="190" rx="4" fill="#23313f" stroke="#3a4551"/>
<text x="54" y="346" font-size="26" fill="#b4c8d8" font-weight="700">program.params</text>
<text x="54" y="390" font-size="23" fill="#dde2e7">Defines the execution interface</text>
<text x="54" y="426" font-size="23" fill="#dde2e7">Which inputs must be supplied?</text>
<rect x="508" y="307" width="420" height="190" rx="4" fill="#202932" stroke="#3a4551"/>
<text x="530" y="346" font-size="26" fill="#c4ccd4" font-weight="700">env</text>
<text x="530" y="390" font-size="23" fill="#dde2e7">Supports translation by name</text>
<text x="530" y="426" font-size="23" fill="#dde2e7">Which Value does n refer to?</text>
<rect x="32" y="530" width="896" height="45" rx="4" fill="#23313f" stroke="#3a4551"/>
<text x="52" y="560" font-size="25" fill="#b4c8d8" font-weight="700">One object   •   Two references   •   No actual integer copied</text>
<rect x="32" y="587" width="896" height="48" rx="4" fill="#202932" stroke="#3a4551"/>
<text x="50" y="619" font-size="21" fill="#c4ccd4">Later assignments extend env without extending the runtime interface</text>
</svg>