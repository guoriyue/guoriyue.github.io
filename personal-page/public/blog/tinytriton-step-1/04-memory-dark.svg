<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">Address calculation and memory access</title><desc id="desc">Program 1 has offsets [4,5,6,7] and mask [True,True,False,False]</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9eb4c7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#d6e4ef}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="680" fill="#111e2c"/>
<text x="32" y="44" font-size="28" style="fill:#d6e4ef" font-weight="700">Address calculation and memory access</text>
<text x="32" y="78" font-size="19" style="fill:#9eb4c7">Program 1 has offsets [4,5,6,7] and mask [True,True,False,False]</text>
<rect x="32" y="110" width="896" height="130" rx="10" fill="#17364b" stroke="#2b4154"/>
<text x="52" y="146" font-size="24" style="fill:#d6e4ef" font-weight="700">1  Calculate addresses</text>
<text x="52" y="188" font-size="27" style="fill:#d6e4ef">x + offsets produces four candidate pointers</text>
<path d="M480 246L480 264" fill="none" stroke="#9eb4c7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="270" width="896" height="130" rx="10" fill="#173b37" stroke="#2b4154"/>
<text x="52" y="306" font-size="24" style="fill:#d6e4ef" font-weight="700">2  Read valid positions</text>
<text x="52" y="348" font-size="27" style="fill:#d6e4ef" class="code">a = [5,6,0,0]       b = [50,60,0,0]</text>
<path d="M480 406L480 424" fill="none" stroke="#9eb4c7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="430" width="896" height="130" rx="10" fill="#3d3023" stroke="#2b4154"/>
<text x="52" y="466" font-size="24" style="fill:#d6e4ef" font-weight="700">3  Write valid positions</text>
<text x="52" y="508" font-size="24" style="fill:#d6e4ef" class="code">a + b = [55,66,0,0]   →   out[4]=55 and out[5]=66</text>
<rect x="32" y="607" width="896" height="48" rx="10" fill="#17364b" stroke="#2b4154"/>
<text x="50" y="639" font-size="21" style="fill:#8bd3ee">Invalid positions use other on load and perform no write on store</text>
</svg>