<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">Address calculation and memory access</title><desc id="desc">Follow program 1 through addresses and data</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a6afb8"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="680" fill="#131b24"/>
<text x="32" y="44" font-size="29" fill="#dde2e7" font-weight="700">Address calculation and memory access</text>
<text x="32" y="78" font-size="20" fill="#a6afb8">Follow program 1 through addresses and data</text>
<rect x="32" y="110" width="896" height="130" rx="4" fill="#23313f" stroke="#3a4551"/>
<text x="54" y="149" font-size="26" fill="#b4c8d8" font-weight="700">1  Addresses</text>
<text x="54" y="193" font-size="27" fill="#dde2e7">Four candidate pointers at offsets 4, 5, 6, and 7</text>
<path d="M480 246L480 264" stroke="#a6afb8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="270" width="896" height="130" rx="4" fill="#202932" stroke="#3a4551"/>
<text x="54" y="309" font-size="26" fill="#c4ccd4" font-weight="700">2  Loaded data</text>
<text x="54" y="353" font-size="26" fill="#dde2e7">x tile   [5, 6, 0, 0]          y tile   [50, 60, 0, 0]</text>
<path d="M480 406L480 424" stroke="#a6afb8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="430" width="896" height="130" rx="4" fill="#23313f" stroke="#3a4551"/>
<text x="54" y="469" font-size="26" fill="#b4c8d8" font-weight="700">3  Output</text>
<text x="54" y="513" font-size="26" fill="#dde2e7">Sum   [55, 66, 0, 0]          Write positions 4 and 5</text>
<rect x="617" y="118" width="285" height="36" rx="4" fill="#352b2a" stroke="#3a4551"/>
<text x="631" y="143" font-size="20" fill="#d1a49c" font-weight="700">Mask excludes 6 and 7</text>
<rect x="32" y="607" width="896" height="48" rx="4" fill="#202932" stroke="#3a4551"/>
<text x="50" y="639" font-size="21" fill="#c4ccd4">The fallback supplies zeros without reading invalid addresses</text>
</svg>