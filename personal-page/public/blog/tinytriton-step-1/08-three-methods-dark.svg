<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">Three methods follow three syntactic levels</title><desc id="desc">The starter provides the helpers but leaves these three implementations empty</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9eb4c7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#d6e4ef}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="650" fill="#111e2c"/>
<text x="32" y="44" font-size="28" style="fill:#d6e4ef" font-weight="700">Three methods follow three syntactic levels</text>
<text x="32" y="78" font-size="19" style="fill:#9eb4c7">The starter provides the helpers but leaves these three implementations empty</text>
<rect x="32" y="110" width="896" height="125" rx="10" fill="#17364b" stroke="#2b4154"/>
<text x="52" y="146" font-size="24" style="fill:#d6e4ef" font-weight="700">lower  →  Function</text>
<text x="52" y="188" font-size="25" style="fill:#d6e4ef">Initialize state and parameters then process statements</text>
<rect x="32" y="270" width="896" height="125" rx="10" fill="#173b37" stroke="#2b4154"/>
<text x="52" y="306" font-size="24" style="fill:#d6e4ef" font-weight="700">statement  →  Statement</text>
<text x="52" y="348" font-size="25" style="fill:#d6e4ef">Visit the right side then bind its source name</text>
<rect x="32" y="430" width="896" height="125" rx="10" fill="#3d3023" stroke="#2b4154"/>
<text x="52" y="466" font-size="24" style="fill:#d6e4ef" font-weight="700">visit  →  Expression</text>
<text x="52" y="508" font-size="25" style="fill:#d6e4ef">Resolve inputs then record the operation and return its Value</text>
<path d="M480 241L480 262" fill="none" stroke="#9eb4c7" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M480 401L480 422" fill="none" stroke="#9eb4c7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="577" width="896" height="48" rx="10" fill="#17364b" stroke="#2b4154"/>
<text x="50" y="609" font-size="21" style="fill:#8bd3ee">parse  /  emit  /  constexpr  /  broadcast  /  call are already implemented</text>
</svg>