<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc"><title id="title">A tree of syntax becomes a graph of dependencies</title><desc id="desc">Small example  answer = a + b * 2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60768a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="610" fill="#f8fafc"/>
<text x="32" y="44" font-size="29" fill="#263d50" font-weight="700">A tree of syntax becomes a graph of dependencies</text>
<text x="32" y="78" font-size="20" fill="#60768a">Small example  answer = a + b * 2</text>
<rect x="32" y="110" width="420" height="390" rx="12" fill="#ffffff" stroke="#d8e3ee"/>
<text x="54" y="149" font-size="26" fill="#263d50" font-weight="700">AST</text>
<rect x="148" y="176" width="190" height="47" rx="12" fill="#dcf5ed" stroke="#d8e3ee"/>
<text x="160" y="207" font-size="20" fill="#166e5b" font-weight="700">Assign answer</text>
<rect x="164" y="258" width="154" height="47" rx="12" fill="#eee6fc" stroke="#d8e3ee"/>
<text x="176" y="289" font-size="20" fill="#65419c" font-weight="700">Add</text>
<rect x="65" y="350" width="140" height="47" rx="12" fill="#e2f1ff" stroke="#d8e3ee"/>
<text x="77" y="381" font-size="20" fill="#215a8b" font-weight="700">Name a</text>
<rect x="263" y="350" width="158" height="47" rx="12" fill="#eee6fc" stroke="#d8e3ee"/>
<text x="275" y="381" font-size="20" fill="#65419c" font-weight="700">Multiply</text>
<rect x="222" y="431" width="100" height="47" rx="12" fill="#e2f1ff" stroke="#d8e3ee"/>
<text x="234" y="462" font-size="20" fill="#215a8b" font-weight="700">Name b</text>
<rect x="335" y="431" width="95" height="47" rx="12" fill="#fff0ce" stroke="#d8e3ee"/>
<text x="347" y="462" font-size="20" fill="#8b5c13" font-weight="700">2</text>
<path d="M243 224L243 250" stroke="#60768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M210 307L140 341" stroke="#60768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M275 307L342 341" stroke="#60768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M310 398L273 423" stroke="#60768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M368 398L382 423" stroke="#60768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="530" y="149" font-size="26" fill="#263d50" font-weight="700">IR</text>
<rect x="508" y="177" width="420" height="62" rx="12" fill="#fff0ce" stroke="#d8e3ee"/>
<text x="529" y="218" font-size="25" fill="#8b5c13" class="code">%0 = const(2)</text>
<rect x="508" y="257" width="420" height="62" rx="12" fill="#eee6fc" stroke="#d8e3ee"/>
<text x="529" y="298" font-size="25" fill="#65419c" class="code">%1 = mul(b, %0)</text>
<rect x="508" y="337" width="420" height="62" rx="12" fill="#dcf5ed" stroke="#d8e3ee"/>
<text x="529" y="378" font-size="25" fill="#166e5b" class="code">%2 = add(a, %1)</text>
<text x="529" y="463" font-size="25" fill="#166e5b" font-weight="700">answer refers to %2</text>
<path d="M461 300L497 300" stroke="#60768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="537" width="896" height="48" rx="12" fill="#e2f1ff" stroke="#d8e3ee"/>
<text x="50" y="569" font-size="21" fill="#215a8b">Blue denotes inputs and amber denotes a known constant</text>
</svg>