<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Compilation and execution receive different inputs</title><desc id="desc">The annotation identifies when a parameter must be supplied</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#646b73"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.code{font-family:Consolas,"DejaVu Sans Mono",monospace}</style><rect width="960" height="640" fill="#ffffff"/>
<text x="32" y="44" font-size="29" fill="#252525" font-weight="700">Compilation and execution receive different inputs</text>
<text x="32" y="78" font-size="20" fill="#646b73">The annotation identifies when a parameter must be supplied</text>
<rect x="32" y="110" width="420" height="240" rx="4" fill="#f1f2f3" stroke="#c9ced4"/>
<text x="54" y="149" font-size="26" fill="#3e4852" font-weight="700">During compilation</text>
<text x="54" y="193" font-size="23" fill="#252525">BLOCK is supplied as 4</text>
<text x="54" y="229" font-size="23" fill="#252525">The compiler saves this choice</text>
<text x="54" y="265" font-size="23" fill="#252525">The tile width is now fixed</text>
<rect x="53" y="300" width="275" height="36" rx="4" fill="#f1f2f3" stroke="#c9ced4"/>
<text x="67" y="325" font-size="21" fill="#3e4852" font-weight="700">Stored in self.block</text>
<rect x="508" y="110" width="420" height="240" rx="4" fill="#e8eef4" stroke="#c9ced4"/>
<text x="530" y="149" font-size="26" fill="#315a7d" font-weight="700">During execution</text>
<text x="530" y="193" font-size="23" fill="#252525">Provide x, y, out, and n</text>
<text x="530" y="229" font-size="23" fill="#252525">Read the actual array contents</text>
<text x="530" y="265" font-size="23" fill="#252525">Use the already fixed width</text>
<path d="M462 231L496 231" stroke="#646b73" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="390" width="896" height="130" rx="4" fill="#f1f2f3" stroke="#c9ced4"/>
<text x="54" y="429" font-size="26" fill="#3e4852" font-weight="700">When translation later encounters BLOCK</text>
<text x="54" y="473" font-size="24" fill="#252525">Look up the saved width → resolve 4 → record the needed constant</text>
<rect x="32" y="567" width="896" height="48" rx="4" fill="#f1f2f3" stroke="#c9ced4"/>
<text x="50" y="599" font-size="21" fill="#3e4852">Skipping runtime registration does not discard the compilation choice</text>
</svg>