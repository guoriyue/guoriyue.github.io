name: Deploy personal page

on:
  push:
    branches: [main]
    paths:
      - 'personal-page/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'personal-page/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-page
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: personal-page/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test scripts/collie-motion.test.mjs
      - run: npm run build
      - name: Check static export
        run: |
          test -s dist/client/index.html
          test -s dist/client/collie-pixel-32.png
          test -s dist/client/section-art.png
          test -s dist/client/research/asset-harvester.mp4
          test -s dist/client/research/nurec.mp4
          test -s dist/client/projects/nyaicon.webp
          touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: personal-page/dist/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
